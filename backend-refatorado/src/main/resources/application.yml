server:
  port: 8080

spring:
  application:
    name: achados-e-devolvidos-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/achados_e_devolvidos}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # "validate": o Hibernate NUNCA cria, altera ou apaga tabelas — ele só
      # confere, na subida da aplicação, se as entidades batem com o schema
      # que o Flyway já migrou. Quem efetivamente cria o banco é o Flyway
      # (veja spring.flyway abaixo e src/main/resources/db/migration).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope:
              - email
              - profile

  mail:
    # Defaults apontam para o sandbox do Mailtrap (dev/teste, não envia de verdade
    # para caixas reais). Usuário/senha não têm default — mesmo tratamento de
    # JWT_SECRET: sem eles configurados via env, o envio de e-mail falha em runtime,
    # não silenciosamente.
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configurações próprias da aplicação
app:
  jwt:
    # Chave em Base64 com pelo menos 256 bits (32 bytes) para HS256.
    # Gere uma com, por exemplo: openssl rand -base64 32
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutos
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 dias

  oauth2:
    # Para onde o navegador é redirecionado após login OU falha via Google.
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login?erro=oauth2}

  password-reset:
    # Página do frontend para onde o link do e-mail de redefinição aponta
    # (?token=... é anexado pelo AuthService).
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
